name: Release Candidate

on:
  workflow_dispatch:
    inputs:
      label:
        description: Optional candidate label
        required: false
        default: manual
  push:
    branches:
      - dev/underlay-route-integration
    tags:
      - 'rc-*'
    paths:
      - 'scripts/build/**'
      - 'scripts/publish/**'
      - '.github/workflows/release-candidate.yml'

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare Rust and protoc
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          choco install protoc --yes --no-progress
          protoc --version
          7z | Select-Object -First 2
      - name: Build Windows release candidate
        shell: pwsh
        run: |
          ./scripts/build/build-windows-release.ps1 -OutputRoot publish/candidate -RuntimeIdentifier win-x64 -Configuration Release
      - name: Upload Windows release candidate
        uses: actions/upload-artifact@v4
        with:
          name: EasyTierHost-windows-${{ github.sha }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            publish/candidate/manager/**
            publish/candidate/seed-windows/**
            publish/candidate/dedicated-windows/**
            publish/candidate/client-windows/**
            publish/candidate/archives/*.zip

  linux-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Prepare Linux build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config build-essential
          rustup toolchain install stable --profile minimal
          protoc --version
          pwsh --version
      - name: Build Linux release candidate
        run: |
          bash scripts/build/build-linux-release.sh --output-root publish/candidate --runtime linux-x64 --configuration Release
      - name: Upload Linux release candidate
        uses: actions/upload-artifact@v4
        with:
          name: EasyTierHost-linux-${{ github.sha }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            publish/candidate/seed-linux/**
            publish/candidate/dedicated-linux/**
            publish/candidate/client-linux/**
            publish/candidate/archives/*.tar.gz
