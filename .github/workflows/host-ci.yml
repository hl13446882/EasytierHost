name: Host CI

on:
  push:
    branches:
      - main
      - dev/underlay-route-integration
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Host solution
        run: dotnet build EasyTierHost.sln --nologo
      - name: Run Host unit tests
        run: dotnet run --project tests/EasyTierHost.UnitTests
