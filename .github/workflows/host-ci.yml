name: Host CI

on:
  push:
    branches:
      - main
      - dev/underlay-route-integration
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Host solution
        run: dotnet build EasyTierHost.sln --nologo
      - name: Build deployment project
        run: dotnet build src/EasyTierHost.Deployment/EasyTierHost.Deployment.csproj --nologo
      - name: Parse Windows deployment scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts/windows/*.ps1) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($file.Name): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Run Host unit tests
        run: dotnet run --project tests/EasyTierHost.UnitTests
      - name: Run underlay integration smoke tests
        run: dotnet run --project tests/EasyTierHost.IntegrationTests
      - name: Install Protocol Buffers compiler
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress
          protoc --version
      - name: Run EasyTier DHCP and underlay tests
        shell: pwsh
        working-directory: EasyTier-2.6.4
        run: |
          $env:PATH = "$PWD/easytier/third_party/x86_64;C:/Program Files/7-Zip;" + $env:PATH
          cargo +stable test -p easytier --lib common::config::dhcp_range --no-default-features --features tun
          cargo +stable test -p easytier --lib underlay_ --no-default-features --features tun
