name: Host CI

on:
  push:
    branches:
      - main
      - dev/underlay-route-integration
  pull_request:

permissions:
  contents: read

concurrency:
  group: host-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Host solution
        run: dotnet build EasyTierHost.sln --nologo
      - name: Build deployment project
        run: dotnet build src/EasyTierHost.Deployment/EasyTierHost.Deployment.csproj --nologo
      - name: Build manager UI
        run: dotnet build src/EasyTierHost.Manager/EasyTierHost.Manager.csproj --nologo
      - name: Build Windows client UI
        run: dotnet build src/EasyTierHost.Client.Windows/EasyTierHost.Client.Windows.csproj --nologo
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem scripts -Filter *.ps1 -Recurse) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($file.FullName): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Parse Linux scripts
        shell: bash
        run: bash -n scripts/linux/install-service.sh scripts/linux/uninstall-service.sh scripts/linux/client-control.sh scripts/validation/collect-linux.sh
      - name: Run Host unit tests
        run: dotnet run --project tests/EasyTierHost.UnitTests
      - name: Run client profile tests
        run: dotnet run --project tests/EasyTierHost.ClientTests
      - name: Run structured diagnostics tests
        run: dotnet run --project tests/EasyTierHost.DiagnosticsTests
      - name: Run underlay integration smoke tests
        run: dotnet run --project tests/EasyTierHost.IntegrationTests
      - name: Run deployment safety tests
        run: dotnet run --project tests/EasyTierHost.DeploymentTests
      - name: Validate Windows and Linux package manifests
        shell: pwsh
        run: |
          $winCore = Join-Path $env:RUNNER_TEMP 'fake-win-core'
          $linuxCore = Join-Path $env:RUNNER_TEMP 'fake-linux-core'
          New-Item -ItemType Directory -Force -Path $winCore,$linuxCore | Out-Null
          Set-Content -LiteralPath (Join-Path $winCore 'easytier-core.exe') -Value 'CI package sentinel core' -NoNewline
          Set-Content -LiteralPath (Join-Path $winCore 'easytier-cli.exe') -Value 'CI package sentinel cli' -NoNewline
          Set-Content -LiteralPath (Join-Path $linuxCore 'easytier-core') -Value 'CI package sentinel core' -NoNewline
          Set-Content -LiteralPath (Join-Path $linuxCore 'easytier-cli') -Value 'CI package sentinel cli' -NoNewline
          ./scripts/publish/publish-windows.ps1 -CoreDirectory $winCore -OutputDirectory 'publish/ci-client-windows' -IncludeClientUi
          ./scripts/publish/verify-package.ps1 -PackageDirectory 'publish/ci-client-windows' -ExpectedPackageKind 'client-windows'
          ./scripts/publish/publish-linux.ps1 -CoreDirectory $linuxCore -OutputDirectory 'publish/ci-client-linux'
          ./scripts/publish/verify-package.ps1 -PackageDirectory 'publish/ci-client-linux' -ExpectedPackageKind 'node-linux'
      - name: Install Protocol Buffers compiler
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress
          protoc --version
      - name: Run EasyTier DHCP and underlay tests
        shell: pwsh
        working-directory: EasyTier-2.6.4
        run: |
          $env:PATH = "$PWD/easytier/third_party/x86_64;C:/Program Files/7-Zip;" + $env:PATH
          cargo +stable test -p easytier --lib common::config::dhcp_range --no-default-features --features tun
          cargo +stable test -p easytier --lib underlay_ --no-default-features --features tun

  linux-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build Host solution on Linux
        run: dotnet build EasyTierHost.sln --nologo
      - name: Build deployment project on Linux
        run: dotnet build src/EasyTierHost.Deployment/EasyTierHost.Deployment.csproj --nologo
      - name: Parse Linux scripts on Linux
        run: bash -n scripts/linux/install-service.sh scripts/linux/uninstall-service.sh scripts/linux/client-control.sh scripts/validation/collect-linux.sh
      - name: Run Host unit tests on Linux
        run: dotnet run --project tests/EasyTierHost.UnitTests
      - name: Run client profile tests on Linux
        run: dotnet run --project tests/EasyTierHost.ClientTests
      - name: Run structured diagnostics tests on Linux
        run: dotnet run --project tests/EasyTierHost.DiagnosticsTests
      - name: Run underlay integration smoke tests on Linux
        run: dotnet run --project tests/EasyTierHost.IntegrationTests
      - name: Run deployment safety tests on Linux
        run: dotnet run --project tests/EasyTierHost.DeploymentTests
